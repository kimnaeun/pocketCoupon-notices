<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ondo Soft</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }

        /* 상단 헤더/브랜드 영역 */
        header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            color: #111111;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1rem;
            color: #6c757d;
        }

        /* 메인 컨텐츠 영역 (그리드 레이아웃) */
        main {
            display: grid;
            grid-template-columns: repeat(1, minmax(0, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 720px;
            padding: 0 1.5rem;
        }

        @media (min-width: 600px) {
            main {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        /* 앱/게임 카드 스타일 */
        .card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 2.5rem 2rem;
            text-align: center;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #eaeaea;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 카드 마우스 호버 효과 */
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            border-color: #d1d1d1;
        }

        /* 아이콘 이미지 스타일 */
        .icon-wrapper {
            width: 96px;
            height: 96px;
            margin-bottom: 1.5rem;
            border-radius: 22px;
            overflow: hidden;
            background-color: #f1f3f5;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
        }

        .icon-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 카드 텍스트 스타일 */
        .card h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #111111;
            margin-bottom: 0.5rem;
        }

        .card p {
            font-size: 0.9rem;
            color: #868e96;
            line-height: 1.4;
        }

        /* 하단 푸터 영역 */
        footer {
            margin-top: 5rem;
            font-size: 0.8rem;
            color: #adb5bd;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ondo Soft</h1>
        <p>We create simple, useful, and delightful digital experiences.</p>
    </header>

    <main>
        <a href="/pocketCoupon/" class="card">
            <div class="icon-wrapper">
                <img src="pocket-coupon-icon.png" alt="포켓쿠폰 아이콘" onerror="this.style.display='none'; this.parentNode.innerText='📱';">
            </div>
            <h2>포켓쿠폰</h2>
            <p>스마트한 기프티콘 자동 관리 및 만료 알림 서비스</p>
        </a>

        <a href="/game/" class="card">
            <div class="icon-wrapper">
                <img src="game-icon.png" alt="게임 프로젝트 아이콘" onerror="this.style.display='none'; this.parentNode.innerText='🎮';">
            </div>
            <h2>픽셀 용병단 디펜스</h2>
            <p>도트 그래픽으로 즐기는 전략적인 타워 디펜스 & RPG</p>
        </a>
    </main>

    <footer>
        <p>&copy; 2026 Ondo Soft. All rights reserved.</p>
    </footer>

</body>
</html>
